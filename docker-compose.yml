version: '3.7'

networks:
  incentives:

services:

  # nginx
  nginx-service:
    image: nginx:stable-alpine
    container_name: incentives-nginx-container
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/incentives-program
      - ./.nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php8-service
    networks:
      - incentives

  # php
  php8-service:
    container_name: incentives-php8-container
    build:
      context: ./.php
      args:
        TIMEZONE: ${TIMEZONE}
    volumes:
      - ./app:/var/www/incentives-program/
    networks:
      - incentives

  # mysql
  mysql8-auction:
    image: mysql:8
    container_name: incentives-mysql8-container
    ports:
      - "4306:3306"
    volumes:
      - ./mysql:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_USER: user
      MYSQL_ROOT_PASSWORD: password
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: incentive
    networks:
      - incentives
