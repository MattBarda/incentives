# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: false      # Automatically injects dependencies in your services.
        autoconfigure: false # Automatically registers your services as commands, event subscribers, etc.
        public: false

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Incentive\UI\Command\UserCreateCommand:
        class: App\Incentive\UI\Command\UserCreateCommand
        arguments:
            $commandBus: '@broadway.command_handling.command_bus'
        tags:
            - { name: 'console.command' }

    App\Incentive\UI\Command\DeliveryCompleteCommand:
        arguments:
            $commandBus: '@broadway.command_handling.command_bus'
        tags:
            - { name: 'console.command' }

    App\Incentive\UI\Command\RideShareCompleteCommand:
        arguments:
            $commandBus: '@broadway.command_handling.command_bus'
        tags:
            - { name: 'console.command' }

    App\Incentive\UI\Command\RentStartCommand:
        arguments:
            $commandBus: '@broadway.command_handling.command_bus'
        tags:
            - { name: 'console.command' }

    App\Incentive\UI\Command\RentCompleteCommand:
        arguments:
            $commandBus: '@broadway.command_handling.command_bus'
        tags:
            - { name: 'console.command' }

    App\Incentive\UI\Command\BoosterActivateCommand:
        arguments:
            $commandBus: '@broadway.command_handling.command_bus'
        tags:
            - { name: 'console.command' }

    App\Incentive\UI\Command\GetUserPointsCommand:
        arguments:
            $getUserPointsUseCase: '@App\Incentive\Application\Service\GetUserPointsUseCase'
        tags:
            - { name: 'console.command' }


    App\Incentive\Application\Service\GetUserPointsUseCase:
        arguments:
            $userPointsRepository: '@App\Incentive\Infrastructure\Repository\FileRepository\UserPointsRepository'


    App\Incentive\Infrastructure\Repository\FileRepository\UserPointsRepository:
        arguments:
            $filePath: "%kernel.project_dir%/public/"

    App\Incentive\Infrastructure\Repository\Projector\UserWasRegisteredProjector:
        arguments:
            $userPointsRepository: '@App\Incentive\Infrastructure\Repository\FileRepository\UserPointsRepository'
        tags:
            - { name: broadway.domain.event_listener }

    App\Incentive\Infrastructure\Repository\Projector\DeliveryCompletedProjector:
        arguments:
            $userPointsRepository: '@App\Incentive\Infrastructure\Repository\FileRepository\UserPointsRepository'
        tags:
            - { name: broadway.domain.event_listener }

    App\Incentive\Infrastructure\Repository\Projector\RideShareCompletedProjector:
        arguments:
            $userPointsRepository: '@App\Incentive\Infrastructure\Repository\FileRepository\UserPointsRepository'
        tags:
            - { name: broadway.domain.event_listener }

    App\Incentive\Infrastructure\Repository\Projector\BoosterAppliedProjector:
        arguments:
            $userPointsRepository: '@App\Incentive\Infrastructure\Repository\FileRepository\UserPointsRepository'
        tags:
            - { name: broadway.domain.event_listener }

    App\Incentive\Infrastructure\Repository\Projector\RentCompletedProjector:
        arguments:
            $userPointsRepository: '@App\Incentive\Infrastructure\Repository\FileRepository\UserPointsRepository'
        tags:
            - { name: broadway.domain.event_listener }


    App\Common\Infrastructure\Cmd\CreateEventStoreCommand:
        arguments:
            $connection: "@doctrine.dbal.default_connection"
            $eventStore: '@broadway.event_store'
        tags:
            - { name: 'console.command' }


    App\Incentive\Infrastructure\Repository\EventStore\EventStoreUserRepository:
        arguments:
            - '@broadway.event_store'
            - '@broadway.event_handling.event_bus'
            -
                - '@broadway.metadata_enriching_event_stream_decorator'

    App\Incentive\Domain\User\CommandHandler\RegisterUserHandler:
        arguments:
            $userRepository: '@App\Incentive\Infrastructure\Repository\EventStore\EventStoreUserRepository'
        tags:
            - { name: 'broadway.command_handler' }

    App\Incentive\Domain\User\CommandHandler\DeliveryCompleteHandler:
        arguments:
            $userRepository: '@App\Incentive\Infrastructure\Repository\EventStore\EventStoreUserRepository'
            $deliveryBonusPoints: 1
        tags:
            - { name: 'broadway.command_handler' }

    App\Incentive\Domain\User\CommandHandler\RideShareCompleteHandler:
        arguments:
            $userRepository: '@App\Incentive\Infrastructure\Repository\EventStore\EventStoreUserRepository'
            $rideShareBonusPoints: 1
        tags:
            - { name: 'broadway.command_handler' }

    App\Incentive\Domain\User\CommandHandler\RentStartHandler:
        arguments:
            $userRepository: '@App\Incentive\Infrastructure\Repository\EventStore\EventStoreUserRepository'
        tags:
            - { name: 'broadway.command_handler' }

    App\Incentive\Domain\User\CommandHandler\RentCompleteHandler:
        arguments:
            $userRepository: '@App\Incentive\Infrastructure\Repository\EventStore\EventStoreUserRepository'
            $rentBonusPointsPerFullDay: 2
        tags:
            - { name: 'broadway.command_handler' }

    App\Incentive\Domain\User\CommandHandler\BoosterActivateHandler:
        arguments:
            $userRepository: '@App\Incentive\Infrastructure\Repository\EventStore\EventStoreUserRepository'
        tags:
            - { name: 'broadway.command_handler' }
